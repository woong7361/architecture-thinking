<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-label="VPC subnet route table rule target network flow">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .vpc { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
      .public { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .private { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .rt { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .rule { fill: #fef9c3; stroke: #ca8a04; stroke-width: 2; }
      .target { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .title { font: 700 24px Arial, sans-serif; fill: #111827; }
      .label { font: 700 16px Arial, sans-serif; fill: #111827; }
      .text { font: 14px Arial, sans-serif; fill: #374151; }
      .small { font: 12px Arial, sans-serif; fill: #475569; }
      .muted { font: 12px Arial, sans-serif; fill: #64748b; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #64748b; stroke-width: 1.7; stroke-dasharray: 5 5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="760" class="bg"/>
  <text x="40" y="48" class="title">VPC에서 트래픽 경로를 읽는 순서</text>
  <text x="40" y="76" class="text">Subnet은 Route Table을 사용하고, Route Table의 rule은 목적지 IP 대역에 따라 다음 네트워크 대상을 결정한다.</text>

  <rect x="40" y="105" width="1100" height="650" rx="14" class="vpc"/>
  <text x="65" y="140" class="label">VPC: dodoclass-vpc / 10.0.0.0/16</text>

  <rect x="70" y="170" width="1030" height="285" rx="12" class="panel"/>
  <text x="95" y="205" class="label">Public subnet 경로</text>

  <rect x="95" y="235" width="205" height="100" rx="10" class="public"/>
  <text x="115" y="265" class="label">Subnet</text>
  <text x="115" y="290" class="text">public1 / public2</text>
  <text x="115" y="314" class="small">10.0.0.0/20, 10.0.16.0/20</text>

  <path d="M300 285 L365 285" class="arrow"/>

  <rect x="365" y="235" width="205" height="100" rx="10" class="rt"/>
  <text x="385" y="265" class="label">Route Table</text>
  <text x="385" y="290" class="text">dodoclass-rtb-public</text>
  <text x="385" y="314" class="small">rtb-09799649c1bb6bbf7</text>

  <path d="M570 285 L635 285" class="arrow"/>

  <rect x="635" y="205" width="230" height="175" rx="10" class="rule"/>
  <text x="655" y="235" class="label">Rules</text>
  <text x="655" y="265" class="text">10.0.0.0/16 -> local</text>
  <text x="655" y="292" class="text">0.0.0.0/0 -> IGW</text>
  <text x="655" y="319" class="text">S3 prefix -> VPCE</text>
  <text x="655" y="350" class="muted">목적지 IP에 따라 target 선택</text>

  <path d="M865 255 C920 230, 930 225, 965 225" class="arrow"/>
  <path d="M865 292 C920 292, 930 292, 965 292" class="arrow"/>
  <path d="M865 319 C920 350, 930 360, 965 365" class="arrow"/>

  <rect x="965" y="185" width="165" height="55" rx="9" class="target"/>
  <text x="985" y="218" class="label">VPC 내부</text>

  <rect x="965" y="265" width="165" height="55" rx="9" class="target"/>
  <text x="985" y="298" class="label">Internet</text>

  <rect x="965" y="345" width="165" height="55" rx="9" class="target"/>
  <text x="985" y="378" class="label">S3</text>

  <rect x="70" y="485" width="1030" height="285" rx="12" class="panel"/>
  <text x="95" y="520" class="label">Private subnet 경로</text>

  <rect x="95" y="550" width="205" height="100" rx="10" class="private"/>
  <text x="115" y="580" class="label">Subnet</text>
  <text x="115" y="605" class="text">private1 / private2</text>
  <text x="115" y="629" class="small">10.0.128.0/20, 10.0.144.0/20</text>

  <path d="M300 600 L365 600" class="arrow"/>

  <rect x="365" y="550" width="205" height="100" rx="10" class="rt"/>
  <text x="385" y="580" class="label">Route Table</text>
  <text x="385" y="605" class="text">cemware-vpc-peering</text>
  <text x="385" y="629" class="small">rtb-03e2afc71d8e785e5</text>

  <path d="M570 600 L635 600" class="arrow"/>

  <rect x="635" y="520" width="230" height="175" rx="10" class="rule"/>
  <text x="655" y="550" class="label">Rules</text>
  <text x="655" y="580" class="text">10.0.0.0/16 -> local</text>
  <text x="655" y="607" class="text">172.31.0.0/16 -> pcx</text>
  <text x="655" y="634" class="text">S3 prefix -> VPCE</text>
  <text x="655" y="665" class="muted">0.0.0.0/0 경로 없음</text>

  <path d="M865 580 C920 555, 930 550, 965 550" class="arrow"/>
  <path d="M865 607 C920 607, 930 607, 965 607" class="arrow"/>
  <path d="M865 634 C920 670, 930 680, 965 690" class="arrow"/>
  <path d="M865 665 C910 705, 930 718, 965 720" class="dashed"/>

  <rect x="965" y="520" width="165" height="55" rx="9" class="target"/>
  <text x="985" y="553" class="label">VPC 내부</text>

  <rect x="965" y="590" width="165" height="55" rx="9" class="target"/>
  <text x="985" y="613" class="label">Peering VPC</text>
  <text x="985" y="635" class="small">172.31.0.0/16</text>

  <rect x="965" y="665" width="165" height="55" rx="9" class="target"/>
  <text x="985" y="698" class="label">S3</text>

  <text x="975" y="740" class="small">Internet 기본 경로 없음</text>
</svg>
