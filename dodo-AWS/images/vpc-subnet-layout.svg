<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-label="VPC subnet layout diagram">
  <defs>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #111827; }
      .label { font: 700 17px Arial, sans-serif; fill: #111827; }
      .text { font: 14px Arial, sans-serif; fill: #374151; }
      .small { font: 12px Arial, sans-serif; fill: #4b5563; }
      .vpc { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
      .az { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .public { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .private { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .internet { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .vpn { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .muted { fill: #64748b; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
  </defs>

  <rect x="20" y="20" width="1000" height="580" rx="12" class="vpc"/>
  <text x="40" y="56" class="title">dodoclass-vpc / 10.0.0.0/16</text>
  <text x="40" y="82" class="text">A VPC is the parent network. Subnets are smaller network zones inside the VPC.</text>

  <rect x="50" y="115" width="435" height="390" rx="10" class="az"/>
  <text x="70" y="145" class="label">Availability Zone: ap-northeast-2a</text>

  <rect x="75" y="175" width="385" height="105" rx="8" class="public"/>
  <text x="95" y="205" class="label">Public subnet 1</text>
  <text x="95" y="230" class="text">dodoclass-subnet-public1-ap-northeast-2a</text>
  <text x="95" y="254" class="small">Typical resources: ALB, NAT Gateway, bastion</text>

  <rect x="75" y="325" width="385" height="130" rx="8" class="private"/>
  <text x="95" y="355" class="label">Private subnet 1</text>
  <text x="95" y="380" class="text">dodoclass-subnet-private1-ap-northeast-2a</text>
  <text x="95" y="404" class="small">Typical resources: ECS task, RDS, Redis, MQ</text>

  <rect x="535" y="115" width="435" height="390" rx="10" class="az"/>
  <text x="555" y="145" class="label">Availability Zone: ap-northeast-2b</text>

  <rect x="560" y="175" width="385" height="105" rx="8" class="public"/>
  <text x="580" y="205" class="label">Public subnet 2</text>
  <text x="580" y="230" class="text">dodoclass-subnet-public2-ap-northeast-2b</text>
  <text x="580" y="254" class="small">Typical resources: ALB, NAT Gateway, bastion</text>

  <rect x="560" y="325" width="385" height="130" rx="8" class="private"/>
  <text x="580" y="355" class="label">Private subnet 2</text>
  <text x="580" y="380" class="text">dodoclass-subnet-private2-ap-northeast-2b</text>
  <text x="580" y="404" class="small">Typical resources: ECS task, RDS, Redis, MQ</text>

  <rect x="75" y="525" width="230" height="50" rx="8" class="internet"/>
  <text x="95" y="556" class="label">Internet Gateway</text>
  <path d="M190 525 C190 495, 190 478, 190 455" class="arrow"/>

  <rect x="735" y="525" width="230" height="50" rx="8" class="vpn"/>
  <text x="755" y="550" class="label">VPN connection</text>
  <text x="755" y="568" class="small">Tunnel into the VPC, not a subnet container</text>
  <path d="M850 525 C850 495, 850 478, 850 455" class="arrow"/>

  <path d="M267 280 C267 300, 267 312, 267 325" class="arrow"/>
  <path d="M752 280 C752 300, 752 312, 752 325" class="arrow"/>

  <text x="330" y="548" class="text">Key point: subnets live inside the VPC. VPN is a connection path into the VPC.</text>
</svg>
