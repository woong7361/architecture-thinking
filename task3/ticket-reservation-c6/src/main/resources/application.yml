# 모든 환경 의존 값은 환경변수로 주입한다(12-factor config). 기본값은 로컬 직접 실행용 폴백이며,
# compose 기동 시 .env -> compose environment 로 덮어써진다. 이미지 1개를 환경만 바꿔 재사용한다.
spring:
  application:
    name: ticket-reservation
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ticket}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:ticket}
    password: ${DB_PASSWORD:ticket}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 데모 시드는 기동 환경에서만 넣는다(compose가 SQL_INIT_MODE=always 를 준다).
  # 테스트 구성은 이 값을 주지 않으므로 시나리오가 만든 데이터만 존재한다.
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true   # 스키마 생성 뒤에 data.sql 을 실행한다
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# 외부 결제사(PG) 엔드포인트. 기동 환경에선 mock-pg 컨테이너를 가리킨다.
pg:
  base-url: ${PG_BASE_URL:http://localhost:8081}

server:
  port: 8080

# Spring Boot Actuator 헬스 체크: 컨테이너 정상 기동 판정 근거.
# db 인디케이터가 포함되어 DB 연결까지 검사한다.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
