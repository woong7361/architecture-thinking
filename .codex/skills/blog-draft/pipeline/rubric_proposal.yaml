# proposal:v1 — slow loop 제안(diff)을 채점하는 rubric.
# writing:v1과 포맷·로더를 공유한다. 각 축은 사다리(ladder)다:
# 점수 = "아래 조건이 모두 충족된 가장 높은 칸". 미학적 판단이 아니라
# 구체 조건의 유무만 보므로 재현성이 높다.
# validator(코드, PASS/REJECT)가 먼저 거른 제안만 여기로 온다.
# 채점 단위는 제안 하나다.
name: "proposal:v1"
scale:
  min: 0
  max: 5
axes:
  diagnosis_specificity:
    weight: 0.30
    scale:
      "0": "target 파일을 지목하지 않고 증상에서 멈춘다 (예: 'evidence가 약하다')"
      "2": "target 파일을 1개 이상 지목한다"
      "3": "target 파일 지목에 더해 어느 단계나 규칙이 원인인지 명시한다"
      "4": "왜 그 단계가 원인인지 메커니즘 문장을 1개 이상 제시한다"
      "5": "그 메커니즘이 analysis.json의 구체 신호와 연결된다"
  effect_plausibility:
    weight: 0.25
    scale:
      "0": "겨냥한 axis를 명시하지 않는다"
      "2": "어떤 axis를 올리려는지 명시한다"
      "3": "diff가 그 axis에 영향을 준다는 연결을 진술한다"
      "4": "변경에서 글 산출 변화, axis 개선까지의 경로를 단계로 서술한다"
      "5": "그 경로를 뒷받침하는 신호나 사례를 인용한다"
  alternative_elimination:
    weight: 0.20
    scale:
      "0": "다른 원인 가능성을 언급하지 않는다"
      "2": "경쟁하는 원인을 1개 이상 언급한다"
      "3": "왜 그 경쟁 원인이 아닌지 진술한다"
      "5": "배제 근거를 analysis.json 신호로 제시한다"
  side_effect_awareness:
    weight: 0.15
    scale:
      "0": "부작용이나 트레이드오프를 언급하지 않는다"
      "2": "부작용 가능성을 일반적으로 언급한다"
      "3": "어느 axis나 단계에 부작용이 가능한지 지목한다"
      "5": "그 부작용을 완화하거나 감시할 방법을 제시한다"
  priority_justification:
    weight: 0.10
    # 한 문서에 제안이 1개뿐이면 정렬할 대상이 없다.
    # 그 경우 이 축은 3.0(중립)으로 고정 채점한다. 축을 빼지 않는 이유는
    # eval 점수의 축 집합이 rubric 축 집합과 정확히 일치해야 하기 때문이다
    # (validate.py 계약). 재정규화 대신 고정 중립값을 써서 로더를 재사용한다.
    scale:
      "0": "여러 제안의 순서나 우선순위 근거가 없다"
      "2": "순서는 있으나 근거가 없다"
      "3": "신호 강도 또는 위험을 근거로 순서를 제시한다"
      "5": "신호 강도 대비 위험을 함께 고려해 정렬한다"
thresholds:
  min_total: 3.8
  min_axis:
    diagnosis_specificity: 3.0
    effect_plausibility: 3.0
    alternative_elimination: 2.5
    side_effect_awareness: 2.5
    priority_justification: 2.5
