openapi: 3.1.0
info:
  title: 테니스 코트 빈자리 알림 API
  version: 1.0.0
  description: |
    v1 계약의 판본을 이어받아 인증 주체, 신청 생성 중 예약처 확인 실패,
    그리고 조기 예약 마감 시각의 출처를 명시한다.

servers:
  - url: https://api.tennis-alert.example.com/v1

security:
  - bearerAuth: []

paths:
  /courts/{courtId}/availability:
    $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1courts~1{courtId}~1availability'

  /alerts:
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: 내 알림 신청 목록 조회
      parameters:
        - $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts/get/parameters/0'
      responses:
        '200':
          description: 본인의 신청 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertList'
        '400':
          $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts/get/responses/400'
        '401':
          $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts/get/responses/401'
        '500':
          $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts/get/responses/500'
        '503':
          $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts/get/responses/503'
    post:
      tags: [alerts]
      operationId: createAlert
      summary: 빈자리 알림 신청
      description: |
        코트·날짜·시간대를 검증하기 위해 저장된 예약 상태를 사용한다.
        결과가 없거나 확인 간격보다 오래됐으면 외부 예약처 확인을 일으키며,
        확인 실패는 502/503/504의 upstream 오류로 돌려준다.
      parameters:
        - $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts/post/parameters/0'
      requestBody:
        $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts/post/requestBody'
      responses:
        '201':
          description: 신청이 만들어졌다.
          headers:
            Location:
              $ref: './tennis-alert-api.yaml-v1.yaml#/components/headers/Location'
            Idempotency-Replayed:
              $ref: './tennis-alert-api.yaml-v1.yaml#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '200':
          description: 같은 조건을 감시 중인 신청
          headers:
            Location:
              $ref: './tennis-alert-api.yaml-v1.yaml#/components/headers/Location'
            Idempotency-Replayed:
              $ref: './tennis-alert-api.yaml-v1.yaml#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '400':
          $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts/post/responses/400'
        '401':
          $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts/post/responses/401'
        '409':
          $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts/post/responses/409'
        '422':
          $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts/post/responses/422'
        '500':
          $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts/post/responses/500'
        '502':
          $ref: './tennis-alert-api.yaml-v1.yaml#/components/responses/UpstreamUnreadable'
        '503':
          $ref: './tennis-alert-api.yaml-v1.yaml#/components/responses/AvailabilityUnavailable'
        '504':
          $ref: './tennis-alert-api.yaml-v1.yaml#/components/responses/UpstreamTimeout'

  /alerts/{alertId}:
    get:
      tags: [alerts]
      operationId: getAlert
      summary: 알림 신청 단건 조회
      parameters:
        - $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts~1{alertId}/get/parameters/0'
      responses:
        '200':
          description: 신청 하나
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '400':
          $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts~1{alertId}/get/responses/400'
        '401':
          $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts~1{alertId}/get/responses/401'
        '404':
          $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts~1{alertId}/get/responses/404'
        '500':
          $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts~1{alertId}/get/responses/500'
        '503':
          $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts~1{alertId}/get/responses/503'
    delete:
      tags: [alerts]
      operationId: cancelAlert
      summary: 알림 신청 해제
      parameters:
        - $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts~1{alertId}/delete/parameters/0'
      responses:
        '200':
          description: 해제 요청을 처리한 뒤의 신청 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '400':
          $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts~1{alertId}/delete/responses/400'
        '401':
          $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts~1{alertId}/delete/responses/401'
        '404':
          $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts~1{alertId}/delete/responses/404'
        '500':
          $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts~1{alertId}/delete/responses/500'
        '503':
          $ref: './tennis-alert-api.yaml-v1.yaml#/paths/~1alerts~1{alertId}/delete/responses/503'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        인증 경계가 Bearer 자격 증명을 검증해 반환한 subject를 사용자 식별자로 쓴다.
        검증 실패, 만료, 위조 또는 비어 있는 자격 증명은 UNAUTHENTICATED(401)이다.
        이 인메모리 구현에서 외부 검증기가 제공되지 않는 동안에는 비어 있지 않은 opaque
        Bearer 값 자체를 subject로 사용한다.

  schemas:
    AlertList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
      additionalProperties: false

    Alert:
      type: object
      x-requirement: [FR-2, FR-5]
      required:
        [alertId, courtId, courtName, reservationUrl, date, slot, status, createdAt, expiresAt, lastCheckedAt, checkDelayed, delivery]
      properties:
        alertId:
          $ref: './tennis-alert-api.yaml-v1.yaml#/components/schemas/AlertId'
        courtId:
          $ref: './tennis-alert-api.yaml-v1.yaml#/components/schemas/CourtId'
        courtName:
          $ref: './tennis-alert-api.yaml-v1.yaml#/components/schemas/CourtName'
        reservationUrl:
          type: string
          format: uri
        date:
          type: string
          format: date
        slot:
          $ref: './tennis-alert-api.yaml-v1.yaml#/components/schemas/TimeSlot'
        status:
          $ref: './tennis-alert-api.yaml-v1.yaml#/components/schemas/AlertStatus'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: |
            이 신청이 만료되는 시각이다. 기본값은 이용 시작 시각이다.
            예약처 확인 결과가 조기 예약 마감 시각을 제공하면 그 시각과 이용 시작 시각 중
            더 이른 시각을 사용한다. 조기 마감 시각은 확인 성공 결과와 함께 저장하고,
            다음 성공 확인에서 새 값이 오면 갱신한다. 제공 포트가 그 값을 제공하지 않는
            확인 결과에서는 이용 시작 시각을 사용한다.
        lastCheckedAt:
          type: [string, 'null']
          format: date-time
        checkDelayed:
          type: boolean
        delivery:
          oneOf:
            - $ref: './tennis-alert-api.yaml-v1.yaml#/components/schemas/AlertDelivery'
            - type: 'null'
      additionalProperties: false
