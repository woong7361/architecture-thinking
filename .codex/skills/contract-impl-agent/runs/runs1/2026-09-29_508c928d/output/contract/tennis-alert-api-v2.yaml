openapi: 3.1.0
info:
  title: 테니스 코트 빈자리 알림 API
  version: 1.0.0
  description: |
    코트·날짜·시간대의 빈자리를 확인하고 알림 신청을 관리한다.
    확인은 조회 요청이 일으키며, 아무도 조회하지 않는 코트·날짜는 확인하지 않는다.
  x-out-of-scope:
    - requirement: NFR-2
      reason: 응답시간 목표는 운영 기준이다.
servers:
  - url: https://api.tennis-alert.example.com/v1
tags:
  - name: alerts
    description: 빈자리 알림 신청의 생성, 조회, 해제
  - name: availability
    description: 외부 예약처에서 가져온 예약 상태 조회
paths:
  /courts/{courtId}/availability:
    get:
      tags: [availability]
      operationId: getCourtAvailability
      summary: 코트·날짜의 예약 상태 조회
      description: 코트 하나와 날짜 하나의 마지막 확인 결과를 돌려준다.
      security: []
      x-requirement: [FR-7, FR-3, NFR-1, EF-1, EF-2, NFR-3, V-4]
      parameters:
        - $ref: '#/components/parameters/CourtIdPath'
        - name: date
          in: query
          required: true
          description: 코트가 있는 지역의 날짜
          schema: { type: string, format: date }
      responses:
        '200':
          description: 저장된 마지막 확인 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourtAvailability' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/CourtNotSupported' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/UpstreamUnreadable' }
        '503': { $ref: '#/components/responses/AvailabilityUnavailable' }
        '504': { $ref: '#/components/responses/UpstreamTimeout' }
  /alerts:
    post:
      tags: [alerts]
      operationId: createAlert
      summary: 빈자리 알림 신청
      description: |
        지원하는 코트·시간대이고 만료 전이면 신청을 저장한다.
        저장된 예약 상태가 없거나 오래됐으면 availability 확인을 직접 일으킨다.
        확인 실패는 외부 확인 실패로 돌려주며 신청을 저장하지 않는다.
      x-requirement: [FR-1, V-1]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertRequest' }
      responses:
        '201':
          description: 신청이 만들어졌다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '200':
          description: 같은 조건을 감시 중인 신청이 이미 있어 그 신청을 돌려준다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '400': { $ref: '#/components/responses/AlertRequestInvalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/IdempotencyKeyReused' }
        '422': { $ref: '#/components/responses/AlertNotAcceptable' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/UpstreamUnreadable' }
        '503': { $ref: '#/components/responses/StorageOrContentionUnavailable' }
        '504': { $ref: '#/components/responses/UpstreamTimeout' }
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: 내 알림 신청 목록 조회
      description: 본인의 신청만 저장된 상태 기준으로 최근 생성 순으로 돌려준다.
      parameters:
        - name: status
          in: query
          required: false
          description: 지정하면 그 상태로 저장된 신청만 돌려준다.
          schema: { $ref: '#/components/schemas/AlertStatus' }
      responses:
        '200':
          description: 본인의 신청 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /alerts/{alertId}:
    get:
      tags: [alerts]
      operationId: getAlert
      summary: 알림 신청 단건 조회
      description: 본인의 신청 하나를 돌려준다. 남의 신청은 없는 것과 같은 404다.
      parameters:
        - $ref: '#/components/parameters/AlertIdPath'
      responses:
        '200':
          description: 신청 하나
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/AlertNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
    delete:
      tags: [alerts]
      operationId: cancelAlert
      summary: 알림 신청 해제
      description: 감시와 아직 보내지 않은 발송을 멈추며 여러 번 불러도 결과가 같다.
      x-requirement: [FR-2, V-8]
      parameters:
        - $ref: '#/components/parameters/AlertIdPath'
      responses:
        '200':
          description: 해제 요청을 처리한 뒤의 신청 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/AlertNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/StorageOrContentionUnavailable' }
components:
  parameters:
    CourtIdPath:
      name: courtId
      in: path
      required: true
      description: 서비스가 지원하는 코트의 식별자
      schema: { $ref: '#/components/schemas/CourtId' }
    AlertIdPath:
      name: alertId
      in: path
      required: true
      description: 알림 신청 UUID
      schema: { $ref: '#/components/schemas/AlertId' }
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: 같은 요청을 재시도할 때 그대로 재사용하는 UUID
      schema: { type: string, format: uuid }
  headers:
    RetryAfter:
      description: 다시 시도하기까지 기다릴 초
      schema: { type: integer, minimum: 1 }
  schemas:
    AlertId: { type: string, format: uuid }
    CourtId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9][a-z0-9-]*$'
    TimeSlot:
      type: object
      required: [startTime, endTime]
      properties:
        startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        endTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
      additionalProperties: false
    AlertStatus:
      type: string
      description: WATCHING은 조회 요청이 있을 때 확인 대상이 되며 끝난 신청은 되살아나지 않는다.
      enum: [WATCHING, NOTIFIED, CANCELED, EXPIRED]
    DeliveryStatus: { type: string, enum: [PENDING, SENT, FAILED] }
    UpstreamFailureReason:
      type: string
      enum: [UPSTREAM_TIMEOUT, UPSTREAM_UNAVAILABLE, UPSTREAM_RESPONSE_UNREADABLE]
    AlertDelivery:
      type: object
      required: [status, attemptCount, lastAttemptAt, failureReason]
      properties:
        status: { $ref: '#/components/schemas/DeliveryStatus' }
        attemptCount: { type: integer, minimum: 0, maximum: 4 }
        lastAttemptAt: { type: [string, 'null'], format: date-time }
        failureReason: { type: [string, 'null'] }
      additionalProperties: false
    AlertRequest:
      type: object
      required: [courtId, date, slot]
      properties:
        courtId: { $ref: '#/components/schemas/CourtId' }
        date: { type: string, format: date }
        slot: { $ref: '#/components/schemas/TimeSlot' }
      additionalProperties: false
    Alert:
      type: object
      required: [alertId, courtId, courtName, reservationUrl, date, slot, status, createdAt, expiresAt, lastCheckedAt, checkDelayed, delivery]
      properties:
        alertId: { $ref: '#/components/schemas/AlertId' }
        courtId: { $ref: '#/components/schemas/CourtId' }
        courtName: { type: string, minLength: 1 }
        reservationUrl: { type: string, format: uri }
        date: { type: string, format: date }
        slot: { $ref: '#/components/schemas/TimeSlot' }
        status: { $ref: '#/components/schemas/AlertStatus' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastCheckedAt: { type: [string, 'null'], format: date-time }
        checkDelayed: { type: boolean }
        delivery:
          oneOf:
            - { $ref: '#/components/schemas/AlertDelivery' }
            - { type: 'null' }
      additionalProperties: false
    AlertList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Alert' }
      additionalProperties: false
    AvailabilitySlot:
      type: object
      required: [startTime, endTime, available]
      properties:
        startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        endTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        available: { type: boolean }
      additionalProperties: false
    CourtAvailability:
      type: object
      required: [courtId, courtName, date, confirmedAt, stale, staleReason, reservationUrl, slots]
      properties:
        courtId: { $ref: '#/components/schemas/CourtId' }
        courtName: { type: string, minLength: 1 }
        date: { type: string, format: date }
        confirmedAt: { type: string, format: date-time }
        stale: { type: boolean }
        staleReason:
          oneOf:
            - { $ref: '#/components/schemas/UpstreamFailureReason' }
            - { type: 'null' }
        reservationUrl: { type: string, format: uri }
        slots:
          type: array
          items: { $ref: '#/components/schemas/AvailabilitySlot' }
      additionalProperties: false
    ErrorCode:
      type: string
      enum: [VALIDATION_FAILED, UNAUTHENTICATED, COURT_NOT_SUPPORTED, SLOT_NOT_SUPPORTED, ALERT_WINDOW_CLOSED, ALERT_NOT_FOUND, IDEMPOTENCY_KEY_REUSED, UPSTREAM_TIMEOUT, UPSTREAM_UNAVAILABLE, UPSTREAM_RESPONSE_UNREADABLE, STORAGE_TIMEOUT, CONCURRENT_UPDATE_CONFLICT, INTERNAL_ERROR]
    Problem:
      type: object
      required: [type, title, status, code, retryable]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { $ref: '#/components/schemas/ErrorCode' }
        retryable: { type: boolean }
        retryAfterSeconds: { type: integer, minimum: 1 }
        traceId: { type: string }
      additionalProperties: false
  responses:
    ValidationFailed:
      description: 요청의 형식이나 값이 올바르지 않다.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AlertRequestInvalid:
      description: 신청 요청이 스키마를 만족하지 않는다.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: 사용자를 식별하지 못했다.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CourtNotSupported:
      description: 지원하지 않는 코트다.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AlertNotFound:
      description: 신청이 없거나 요청한 사용자의 것이 아니다.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IdempotencyKeyReused:
      description: 멱등 키가 다른 요청에 재사용됐다.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AlertNotAcceptable:
      description: 요청 조건을 감시할 수 없다.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UpstreamUnreadable:
      description: 외부 예약처 응답을 읽지 못했다.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UpstreamTimeout:
      description: 외부 예약처가 제때 응답하지 않았다.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AvailabilityUnavailable:
      description: 예약 상태를 돌려줄 수 없다.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    StorageUnavailable:
      description: 저장소가 제때 응답하지 않았다.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    StorageOrContentionUnavailable:
      description: 저장소 장애 또는 동시 수정 경합이다.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: 서버 내부 실패다.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
