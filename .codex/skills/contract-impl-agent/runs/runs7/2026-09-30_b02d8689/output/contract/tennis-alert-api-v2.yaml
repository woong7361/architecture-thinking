openapi: 3.1.0
info:
  title: 테니스 코트 빈자리 알림 API
  version: 1.0.0
  description: |
    사용자가 지정한 코트·날짜·시간대에 빈자리가 생기면 알려 주는 서비스의 HTTP 계약이다.
    요구사항은 `phase2/taskE/tennis-court-service-plan.md`이며, 이 파일의 모든 요소는 그 문서의 항목에서 왔다.
    각 오퍼레이션의 `x-requirement`가 출처를 가리킨다.

    ## 계약 범위 밖

    - 예약과 취소는 외부 예약 사이트에서 이뤄진다. 이 API로는 예약할 수 없고 예약 성공 여부도 알 수 없다.
    - 알림 발송(FR-4)과 만료(FR-5)는 서버가 스스로 수행하므로 엔드포인트가 없다. 그 결과는 신청 조회 응답의 `status`와 `delivery`로 드러난다.
    - 코트 목록과 검색은 이 서비스의 범위 밖이다. 예약 상태는 코트 하나와 날짜 하나 단위로만 가져오고 조회하며, `courtId`는 밖에서 받는다.
    - 인증 방식 자체는 이 계약이 정하지 않는다. 남의 신청을 조회·해제할 수 없다는 FR-2의 요구 때문에 사용자 식별이 필요하며, 그 수단으로 Bearer 토큰을 쓴다.
    - 빈자리를 확인한 뒤 알림이 단말까지 가는 경로(FR-4, FR-6)는 요청과 응답이 아니라 채널을 지나는 메시지라 `notification-asyncapi.yaml`이 정한다. 두 계약은 같은 개념에 같은 이름과 형식을 쓰며, 그 일치는 계약 검사 스크립트가 판정한다.

    ## 시간 표현

    - 타임스탬프는 RFC 3339 형식이며 UTC로 표기한다.
    - `date`는 코트가 있는 지역의 날짜이고, `startTime`과 `endTime`은 그 지역의 24시간제 시각이다. 현재 지원 지역의 시간대는 `Asia/Seoul`이다.

    ## 호환성

    - 경로의 `/v1`이 주 버전이다. 호환을 깨는 변경은 주 버전을 올려야 하며 같은 버전 안에서는 할 수 없다.
    - 호환을 깨는 변경은 넷이다. 요청에 필수 필드를 더하는 것, 응답에서 필드를 빼는 것, 열거형에서 값을 빼는 것, 타입이나 형식을 좁히는 것이다.
    - 응답의 열거형에 값을 더하는 것은 호환을 깨지 않는다. 클라이언트는 모르는 값을 받으면 무시하지 말고 알 수 없는 상태로 다뤄야 한다.

  x-out-of-scope:
    - requirement: NFR-2
      reason: 응답시간 목표는 이 계약이 정하는 요청과 응답의 모양이 아니라 운영이 지켜야 할 성능 기준이다. 부하 시험으로 판정한다.

servers:
  - url: https://api.tennis-alert.example.com/v1

security:
  - bearerAuth: []

tags:
  - name: alerts
    description: 빈자리 알림 신청의 생성, 조회, 해제
  - name: availability
    description: 외부 예약처에서 가져온 예약 상태 조회

paths:
  /courts/{courtId}/availability:
    get:
      tags: [availability]
      operationId: getCourtAvailability
      summary: 코트·날짜의 예약 상태 조회
      description: |
        코트 하나의 하루치 예약 상태를 돌려준다. 서버는 코트·날짜 단위로 확인 결과를 저장해 두고,
        저장된 결과가 확인 간격보다 오래됐거나 한 번도 없으면 이 요청이 외부 예약처 확인을 일으킨다.
        확인 간격은 요구사항 NFR-3이 정하고, 확인 실패로 나가는 응답의 `retryAfterSeconds`도 그 간격을 따른다.

        확인이 일어나는 동안 같은 코트·날짜로 들어온 다른 요청은 예약처를 따로 조회하지 않고 그 결과를 기다린다.
        기다리던 요청은 모두 같은 내용을 받고, 확인이 실패하면 모두 같은 실패를 받는다.
        그래서 피크 초당 200건(NFR-1)이 몰려도 예약처로 나가는 조회는 확인 간격마다 한 번이다.

        확인에 실패해도 저장된 마지막 성공 결과가 있으면 그 결과를 200으로 돌려주고 `stale`을 true로 두며
        `staleReason`에 무엇이 실패했는지를 담는다. 처리 자체는 성공했고 달라진 것은 데이터의 신선도라서 200이다.
        저장된 성공 결과가 한 번도 없을 때만 5xx로 실패를 알린다.

        이 오퍼레이션만 인증을 요구하지 않는다. 신청하기 전에 조건을 고르려면 먼저 볼 수 있어야 하고,
        돌려주는 값에 사용자를 가리키는 것이 없다.
      security: []
      x-requirement: [FR-7, FR-3, NFR-1, EF-1, EF-2, NFR-3, V-4]
      parameters:
        - $ref: './tennis-alert-api-v1.yaml#/components/parameters/CourtIdPath'
        - name: date
          in: query
          required: true
          description: 조회할 날짜다. 코트가 있는 지역의 날짜를 쓴다.
          schema:
            type: string
            format: date
      responses:
        '200': { $ref: './tennis-alert-api-v1.yaml#/paths/~1courts~1{courtId}~1availability/get/responses/200' }
        '400': { $ref: './tennis-alert-api-v1.yaml#/components/responses/ValidationFailed' }
        '404': { $ref: './tennis-alert-api-v1.yaml#/components/responses/CourtNotSupported' }
        '500': { $ref: './tennis-alert-api-v1.yaml#/components/responses/InternalError' }
        '502': { $ref: './tennis-alert-api-v1.yaml#/components/responses/UpstreamUnreadable' }
        '503': { $ref: './tennis-alert-api-v1.yaml#/components/responses/AvailabilityUnavailable' }
        '504': { $ref: './tennis-alert-api-v1.yaml#/components/responses/UpstreamTimeout' }

  /alerts:
    post:
      tags: [alerts]
      operationId: createAlert
      summary: 빈자리 알림 신청
      description: |
        코트 하나, 날짜 하나, 시간대 하나로 알림을 신청한다. 신청은 감시 중으로 시작한다.

        이 오퍼레이션은 재시도해도 안전하다. `Idempotency-Key` 헤더가 필수이며, 같은 키로 같은 요청을 다시 보내면
        서버는 새 신청을 만들지 않고 처음 돌려준 응답을 그대로 다시 돌려준다. 그래서 응답을 받지 못했거나 5xx를 받았으면
        같은 키로 그대로 다시 보내면 된다. 4xx는 요청을 고쳐야 풀리므로 기록하지 않고, 같은 키로 다시 보내면 조건을 다시 판정한다.

        같은 키의 앞선 요청이 아직 처리 중이면 서버는 503 `CONCURRENT_UPDATE_CONFLICT`로 물러난다.
        `Retry-After`만큼 기다렸다 같은 키로 다시 보내면 그 요청의 결과를 재생으로 받는다.

        재생되는 응답은 처음 처리한 시점의 내용이다. 그 뒤로 신청의 상태가 바뀌었어도 재생 응답은 바뀌지 않으므로,
        지금 상태가 필요하면 신청 조회로 다시 읽는다. 재생인지 여부는 `Idempotency-Replayed`가 알린다.

        감시 중인 신청과 같은 코트·날짜·시간대로 다시 신청하면, 키가 달라도 새 신청을 만들지 않고 그 신청을 200으로 돌려준다.
        이미 끝난 신청과 같은 조건이면 새 신청을 만든다. 끝난 신청은 되살아나지 않지만 같은 조건을 다시 감시할 수는 있다.
      x-requirement: [FR-1, V-1]
      parameters:
        - $ref: './tennis-alert-api-v1.yaml#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        $ref: './tennis-alert-api-v1.yaml#/paths/~1alerts/post/requestBody'
      responses:
        '201': { $ref: './tennis-alert-api-v1.yaml#/paths/~1alerts/post/responses/201' }
        '200': { $ref: './tennis-alert-api-v1.yaml#/paths/~1alerts/post/responses/200' }
        '400': { $ref: './tennis-alert-api-v1.yaml#/components/responses/AlertRequestInvalid' }
        '401': { $ref: './tennis-alert-api-v1.yaml#/components/responses/Unauthenticated' }
        '409': { $ref: './tennis-alert-api-v1.yaml#/components/responses/IdempotencyKeyReused' }
        '422': { $ref: './tennis-alert-api-v1.yaml#/components/responses/AlertNotAcceptable' }
        '500': { $ref: './tennis-alert-api-v1.yaml#/components/responses/InternalError' }
        '503': { $ref: './tennis-alert-api-v1.yaml#/components/responses/StorageOrContentionUnavailable' }
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: 내 알림 신청 목록 조회
      description: |
        요청한 사용자 본인의 신청만 돌려준다. 남의 신청은 어떤 방법으로도 이 목록에 나오지 않는다.

        `status`를 지정하지 않으면 끝난 신청까지 모두 돌려준다. 거르는 기준은 저장된 `status`이므로,
        만료 시각이 지났지만 아직 감시 중으로 저장된 신청은 `status=WATCHING`으로 걸러도 함께 온다.

        감시 중인 신청은 1인당 두세 건이라고 NFR-1이 보았기에 페이지를 나누지 않는다.
        끝난 신청은 계속 쌓이므로 보관 기간이 정해지기 전까지 응답 크기의 상한은 없다.
      x-requirement: [FR-2, NFR-1]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: './tennis-alert-api-v1.yaml#/components/schemas/AlertStatus'
      responses:
        '200': { $ref: './tennis-alert-api-v1.yaml#/paths/~1alerts/get/responses/200' }
        '400': { $ref: './tennis-alert-api-v1.yaml#/components/responses/ValidationFailed' }
        '401': { $ref: './tennis-alert-api-v1.yaml#/components/responses/Unauthenticated' }
        '500': { $ref: './tennis-alert-api-v1.yaml#/components/responses/InternalError' }
        '503': { $ref: './tennis-alert-api-v1.yaml#/components/responses/StorageUnavailable' }

  /alerts/{alertId}:
    get:
      tags: [alerts]
      operationId: getAlert
      summary: 알림 신청 단건 조회
      description: |
        본인의 신청 하나를 돌려준다. 남의 신청을 요청하면 존재 여부를 드러내지 않기 위해 없는 것과 같은 404를 돌려준다.
      x-requirement: [FR-2]
      parameters:
        - $ref: './tennis-alert-api-v1.yaml#/components/parameters/AlertIdPath'
      responses:
        '200': { $ref: './tennis-alert-api-v1.yaml#/paths/~1alerts~1{alertId}/get/responses/200' }
        '400': { $ref: './tennis-alert-api-v1.yaml#/components/responses/ValidationFailed' }
        '401': { $ref: './tennis-alert-api-v1.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: './tennis-alert-api-v1.yaml#/components/responses/AlertNotFound' }
        '500': { $ref: './tennis-alert-api-v1.yaml#/components/responses/InternalError' }
        '503': { $ref: './tennis-alert-api-v1.yaml#/components/responses/StorageUnavailable' }
    delete:
      tags: [alerts]
      operationId: cancelAlert
      summary: 알림 신청 해제
      description: |
        감시와 발송을 멈춘다. 해제된 신청은 되살아나지 않고, 아직 보내지 않은 발송 대기가 있으면 그 대기는 버려진다.
        이미 나간 알림은 취소되지 않는다.

        이 오퍼레이션은 여러 번 불러도 결과가 같다. 이미 끝난 신청에 다시 요청하면 상태를 바꾸지 않고 현재 상태를 돌려준다.
        해제한 신청도 기록은 남으므로 조회에서는 계속 보인다.
      x-requirement: [FR-2, V-8]
      parameters:
        - $ref: './tennis-alert-api-v1.yaml#/components/parameters/AlertIdPath'
      responses:
        '200': { $ref: './tennis-alert-api-v1.yaml#/paths/~1alerts~1{alertId}/delete/responses/200' }
        '400': { $ref: './tennis-alert-api-v1.yaml#/components/responses/ValidationFailed' }
        '401': { $ref: './tennis-alert-api-v1.yaml#/components/responses/Unauthenticated' }
        '404': { $ref: './tennis-alert-api-v1.yaml#/components/responses/AlertNotFound' }
        '503': { $ref: './tennis-alert-api-v1.yaml#/components/responses/StorageOrContentionUnavailable' }

components:
  securitySchemes:
    bearerAuth:
      $ref: './tennis-alert-api-v1.yaml#/components/securitySchemes/bearerAuth'
  parameters:
    CourtIdPath:
      $ref: './tennis-alert-api-v1.yaml#/components/parameters/CourtIdPath'
    AlertIdPath:
      $ref: './tennis-alert-api-v1.yaml#/components/parameters/AlertIdPath'
    IdempotencyKeyHeader:
      $ref: './tennis-alert-api-v1.yaml#/components/parameters/IdempotencyKeyHeader'
  headers:
    Location:
      $ref: './tennis-alert-api-v1.yaml#/components/headers/Location'
    IdempotencyReplayed:
      $ref: './tennis-alert-api-v1.yaml#/components/headers/IdempotencyReplayed'
    RetryAfter:
      $ref: './tennis-alert-api-v1.yaml#/components/headers/RetryAfter'
  responses:
    ValidationFailed:
      $ref: './tennis-alert-api-v1.yaml#/components/responses/ValidationFailed'
    AlertRequestInvalid:
      $ref: './tennis-alert-api-v1.yaml#/components/responses/AlertRequestInvalid'
    Unauthenticated:
      $ref: './tennis-alert-api-v1.yaml#/components/responses/Unauthenticated'
    CourtNotSupported:
      $ref: './tennis-alert-api-v1.yaml#/components/responses/CourtNotSupported'
    AlertNotFound:
      $ref: './tennis-alert-api-v1.yaml#/components/responses/AlertNotFound'
    IdempotencyKeyReused:
      $ref: './tennis-alert-api-v1.yaml#/components/responses/IdempotencyKeyReused'
    AlertNotAcceptable:
      $ref: './tennis-alert-api-v1.yaml#/components/responses/AlertNotAcceptable'
    UpstreamUnreadable:
      $ref: './tennis-alert-api-v1.yaml#/components/responses/UpstreamUnreadable'
    UpstreamTimeout:
      $ref: './tennis-alert-api-v1.yaml#/components/responses/UpstreamTimeout'
    AvailabilityUnavailable:
      $ref: './tennis-alert-api-v1.yaml#/components/responses/AvailabilityUnavailable'
    StorageUnavailable:
      $ref: './tennis-alert-api-v1.yaml#/components/responses/StorageUnavailable'
    StorageOrContentionUnavailable:
      $ref: './tennis-alert-api-v1.yaml#/components/responses/StorageOrContentionUnavailable'
    InternalError:
      $ref: './tennis-alert-api-v1.yaml#/components/responses/InternalError'
  schemas:
    Alert:
      type: object
      x-requirement: [FR-2, FR-5]
      description: |
        알림 신청 하나다.

        `status`와 `delivery`는 함께 읽는다. `delivery.status`가 `SENT`인 신청은 `status`가 `NOTIFIED`이고,
        `NOTIFIED`인 신청의 `delivery`는 언제나 `SENT`다. 감시 중인 신청의 `delivery`는 null이거나 `PENDING`이다.
        `FAILED`는 재시도를 모두 쓴 것이라, `status`가 감시 중이어도 이 신청에는 다시 알림이 나가지 않는다.
        신청은 감시 중으로 시작하며 NOTIFIED·CANCELED·EXPIRED 중 하나로 끝난 뒤 되살아나지 않는다.
        발송 전에 취소된 `PENDING` 대기는 사라져 `delivery`가 다시 null이 된다.
      required: [alertId, courtId, courtName, reservationUrl, date, slot, status, createdAt, expiresAt, lastCheckedAt, checkDelayed, delivery]
      properties:
        alertId: { $ref: './tennis-alert-api-v1.yaml#/components/schemas/AlertId' }
        courtId: { $ref: './tennis-alert-api-v1.yaml#/components/schemas/CourtId' }
        courtName: { $ref: './tennis-alert-api-v1.yaml#/components/schemas/CourtName' }
        reservationUrl:
          type: string
          format: uri
        date:
          type: string
          format: date
        slot: { $ref: './tennis-alert-api-v1.yaml#/components/schemas/TimeSlot' }
        status: { $ref: './tennis-alert-api-v1.yaml#/components/schemas/AlertStatus' }
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastCheckedAt:
          type: [string, 'null']
          format: date-time
        checkDelayed:
          type: boolean
        delivery:
          oneOf:
            - $ref: './tennis-alert-api-v1.yaml#/components/schemas/AlertDelivery'
            - type: 'null'
      additionalProperties: false
    CourtAvailability:
      type: object
      x-requirement: [FR-7, FR-3, EF-1]
      required: [courtId, courtName, date, confirmedAt, stale, staleReason, reservationUrl, slots]
      properties:
        courtId: { $ref: './tennis-alert-api-v1.yaml#/components/schemas/CourtId' }
        courtName: { $ref: './tennis-alert-api-v1.yaml#/components/schemas/CourtName' }
        date:
          type: string
          format: date
        confirmedAt:
          type: string
          format: date-time
        stale:
          type: boolean
          description: |
            true이면 가장 최근 확인이 실패해 그 전에 성공한 결과를 돌려준 것이다.
            이는 요청 처리의 실패가 아니라 데이터가 최신 확인에 실패해 오래됐다는 뜻이다.
        staleReason:
          oneOf:
            - $ref: './tennis-alert-api-v1.yaml#/components/schemas/UpstreamFailureReason'
            - type: 'null'
          description: '`stale`이 true일 때만 마지막 확인 실패 이유를 담고, false이면 null이다.'
        reservationUrl:
          type: string
          format: uri
        slots:
          type: array
          description: |
            `available`은 `confirmedAt` 시점의 사실이다. 확인 실패는 빈자리 없음으로 해석하지 않고
            `stale`과 `staleReason`으로 드러낸다.
          items:
            $ref: './tennis-alert-api-v1.yaml#/components/schemas/AvailabilitySlot'
      additionalProperties: false
    AlertList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: |
            본인의 신청 전부만 담고, 최근에 신청한 것이 앞에 온다. `status`를 지정하면 저장된 상태를 기준으로
            거르며, 끝난 신청도 포함한다. 이 범위에서는 페이지네이션을 두지 않는다.
          items:
            $ref: '#/components/schemas/Alert'
      additionalProperties: false
    Problem:
      type: object
      description: |
        RFC 9457 형식의 실패 응답이다. `code`가 원인을 가리키고 `retryable`이 클라이언트의 다음 행동을 정한다.
        `retryable`이 true이면 `retryAfterSeconds`와 `Retry-After` 헤더가 반드시 함께 온다.
        `traceId`는 5xx에만 싣고 4xx에는 싣지 않는다. 응답의 `status`는 HTTP 상태 코드와 같다.
      required: [type, title, status, code, retryable]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          $ref: './tennis-alert-api-v1.yaml#/components/schemas/ErrorCode'
        retryable:
          type: boolean
        retryAfterSeconds:
          type: integer
          minimum: 1
        traceId:
          type: string
      additionalProperties: false
