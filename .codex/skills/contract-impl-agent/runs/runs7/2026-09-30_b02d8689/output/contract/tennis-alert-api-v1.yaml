openapi: 3.1.0
info:
  title: 테니스 코트 빈자리 알림 API
  version: 1.0.0
  description: |
    사용자가 지정한 코트·날짜·시간대에 빈자리가 생기면 알려 주는 서비스의 HTTP 계약이다.
    요구사항은 `phase2/taskE/tennis-court-service-plan.md`이며, 이 파일의 모든 요소는 그 문서의 항목에서 왔다.
    각 오퍼레이션의 `x-requirement`가 출처를 가리킨다.
servers:
  - url: https://api.tennis-alert.example.com/v1
security:
  - bearerAuth: []
tags:
  - name: alerts
    description: 빈자리 알림 신청의 생성, 조회, 해제
  - name: availability
    description: 외부 예약처에서 가져온 예약 상태 조회
paths:
  /courts/{courtId}/availability:
    get:
      tags: [availability]
      operationId: getCourtAvailability
      summary: 코트·날짜의 예약 상태 조회
      security: []
      parameters:
        - $ref: '#/components/parameters/CourtIdPath'
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 저장된 마지막 확인 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourtAvailability'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/CourtNotSupported' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/UpstreamUnreadable' }
        '503': { $ref: '#/components/responses/AvailabilityUnavailable' }
        '504': { $ref: '#/components/responses/UpstreamTimeout' }
  /alerts:
    post:
      tags: [alerts]
      operationId: createAlert
      summary: 빈자리 알림 신청
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRequest'
      responses:
        '201':
          description: 신청이 만들어졌다.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '200':
          description: 같은 조건을 감시 중인 신청이 이미 있어 그 신청을 돌려준다.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '400': { $ref: '#/components/responses/AlertRequestInvalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/IdempotencyKeyReused' }
        '422': { $ref: '#/components/responses/AlertNotAcceptable' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/StorageOrContentionUnavailable' }
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: 내 알림 신청 목록 조회
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AlertStatus' }
      responses:
        '200':
          description: 본인의 신청 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /alerts/{alertId}:
    get:
      tags: [alerts]
      operationId: getAlert
      summary: 알림 신청 단건 조회
      parameters:
        - $ref: '#/components/parameters/AlertIdPath'
      responses:
        '200':
          description: 신청 하나
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/AlertNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
    delete:
      tags: [alerts]
      operationId: cancelAlert
      summary: 알림 신청 해제
      parameters:
        - $ref: '#/components/parameters/AlertIdPath'
      responses:
        '200':
          description: 해제 요청을 처리한 뒤의 신청 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/AlertNotFound' }
        '503': { $ref: '#/components/responses/StorageOrContentionUnavailable' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 사용자를 식별한다. 토큰이 가리키는 사용자만 자기 신청을 조회하고 해제할 수 있다.
  parameters:
    CourtIdPath:
      name: courtId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CourtId' }
    AlertIdPath:
      name: alertId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/AlertId' }
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  headers:
    Location:
      description: 만들어졌거나 이미 있던 신청의 위치
      schema:
        type: string
        format: uri-reference
    IdempotencyReplayed:
      description: 재생 여부
      required: true
      schema: { type: boolean }
    RetryAfter:
      description: 다시 시도하기까지 기다릴 초
      schema:
        type: integer
        minimum: 1
  schemas:
    AlertId:
      type: string
      format: uuid
    CourtName:
      type: string
      minLength: 1
    CourtId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9][a-z0-9-]*$'
    TimeSlot:
      type: object
      required: [startTime, endTime]
      properties:
        startTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        endTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      additionalProperties: false
    AlertStatus:
      type: string
      enum: [WATCHING, NOTIFIED, CANCELED, EXPIRED]
    DeliveryStatus:
      type: string
      enum: [PENDING, SENT, FAILED]
    UpstreamFailureReason:
      type: string
      enum: [UPSTREAM_TIMEOUT, UPSTREAM_UNAVAILABLE, UPSTREAM_RESPONSE_UNREADABLE]
    AlertDelivery:
      type: object
      required: [status, attemptCount, lastAttemptAt, failureReason]
      properties:
        status: { $ref: '#/components/schemas/DeliveryStatus' }
        attemptCount:
          type: integer
          minimum: 0
          maximum: 4
        lastAttemptAt:
          type: [string, 'null']
          format: date-time
        failureReason:
          type: [string, 'null']
      additionalProperties: false
    AlertRequest:
      type: object
      required: [courtId, date, slot]
      properties:
        courtId: { $ref: '#/components/schemas/CourtId' }
        date:
          type: string
          format: date
        slot: { $ref: '#/components/schemas/TimeSlot' }
      additionalProperties: false
    Alert:
      type: object
      required:
        [alertId, courtId, courtName, reservationUrl, date, slot, status, createdAt, expiresAt, lastCheckedAt, checkDelayed, delivery]
      properties:
        alertId: { $ref: '#/components/schemas/AlertId' }
        courtId: { $ref: '#/components/schemas/CourtId' }
        courtName: { $ref: '#/components/schemas/CourtName' }
        reservationUrl:
          type: string
          format: uri
        date:
          type: string
          format: date
        slot: { $ref: '#/components/schemas/TimeSlot' }
        status: { $ref: '#/components/schemas/AlertStatus' }
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastCheckedAt:
          type: [string, 'null']
          format: date-time
        checkDelayed: { type: boolean }
        delivery:
          oneOf:
            - $ref: '#/components/schemas/AlertDelivery'
            - type: 'null'
      additionalProperties: false
    AlertList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Alert' }
      additionalProperties: false
    AvailabilitySlot:
      type: object
      required: [startTime, endTime, available]
      properties:
        startTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        endTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        available: { type: boolean }
      additionalProperties: false
    CourtAvailability:
      type: object
      required: [courtId, courtName, date, confirmedAt, stale, staleReason, reservationUrl, slots]
      properties:
        courtId: { $ref: '#/components/schemas/CourtId' }
        courtName: { $ref: '#/components/schemas/CourtName' }
        date:
          type: string
          format: date
        confirmedAt:
          type: string
          format: date-time
        stale: { type: boolean }
        staleReason:
          oneOf:
            - $ref: '#/components/schemas/UpstreamFailureReason'
            - type: 'null'
        reservationUrl:
          type: string
          format: uri
        slots:
          type: array
          items: { $ref: '#/components/schemas/AvailabilitySlot' }
      additionalProperties: false
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - COURT_NOT_SUPPORTED
        - SLOT_NOT_SUPPORTED
        - ALERT_WINDOW_CLOSED
        - ALERT_NOT_FOUND
        - IDEMPOTENCY_KEY_REUSED
        - UPSTREAM_TIMEOUT
        - UPSTREAM_UNAVAILABLE
        - UPSTREAM_RESPONSE_UNREADABLE
        - STORAGE_TIMEOUT
        - CONCURRENT_UPDATE_CONFLICT
        - INTERNAL_ERROR
    Problem:
      type: object
      required: [type, title, status, code, retryable]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { $ref: '#/components/schemas/ErrorCode' }
        retryable: { type: boolean }
        retryAfterSeconds:
          type: integer
          minimum: 1
        traceId: { type: string }
      additionalProperties: false
  responses:
    ValidationFailed:
      description: 요청 자체가 스키마를 만족하지 않아 처리하지 않았다.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
      x-error-codes: [VALIDATION_FAILED]
    AlertRequestInvalid:
      description: 요청이 스키마를 만족하지 않는다.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
      x-error-codes: [VALIDATION_FAILED]
    Unauthenticated:
      description: 사용자를 식별하지 못해 본인 것인지 판단할 수 없다.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
      x-error-codes: [UNAUTHENTICATED]
    CourtNotSupported:
      description: 경로가 가리킨 코트를 서비스가 다루지 않는다.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
      x-error-codes: [COURT_NOT_SUPPORTED]
    AlertNotFound:
      description: 없는 신청과 남의 신청을 구분해 알리지 않는다.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
      x-error-codes: [ALERT_NOT_FOUND]
    IdempotencyKeyReused:
      description: 멱등 키가 앞선 요청의 내용과 어긋난다.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
      x-error-codes: [IDEMPOTENCY_KEY_REUSED]
    AlertNotAcceptable:
      description: 요청 형식은 맞지만 본문이 가리킨 조건을 감시할 수 없다.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
      x-error-codes: [COURT_NOT_SUPPORTED, SLOT_NOT_SUPPORTED, ALERT_WINDOW_CLOSED]
    UpstreamUnreadable:
      description: 외부 예약처의 응답을 읽지 못했고 저장된 마지막 성공 결과도 없다.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
      x-error-codes: [UPSTREAM_RESPONSE_UNREADABLE]
    UpstreamTimeout:
      description: 외부 예약처가 제때 응답하지 않았고 저장된 마지막 성공 결과도 없다.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
      x-error-codes: [UPSTREAM_TIMEOUT]
    AvailabilityUnavailable:
      description: 예약 상태를 돌려줄 수 없다.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
      x-error-codes: [UPSTREAM_UNAVAILABLE, STORAGE_TIMEOUT]
    StorageUnavailable:
      description: 저장소가 제때 응답하지 않아 처리하지 못했다.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
      x-error-codes: [STORAGE_TIMEOUT]
    StorageOrContentionUnavailable:
      description: 저장소가 제때 응답하지 않았거나 같은 자원을 고치려는 요청끼리 경합에 밀렸다.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
      x-error-codes: [STORAGE_TIMEOUT, CONCURRENT_UPDATE_CONFLICT]
    InternalError:
      description: 서버 내부에서 처리하지 못했다.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
      x-error-codes: [INTERNAL_ERROR]
