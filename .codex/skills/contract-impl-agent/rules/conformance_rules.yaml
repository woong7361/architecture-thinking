# 규칙 카드
#
# 위반과 기록마다 id를 붙이고 그 뜻을 여기 한 줄로 고정한다. 모델이 위반 문장을 매번 새로 쓰면 같은 위반이
# run마다 다른 말로 남아 집계가 안 된다. 판정값을 카드에 두면 어떤 초과를 위반으로 보고 어떤 초과를 기록으로
# 볼지가 한 파일에 모이고, 계약이 그 자리를 닫거나 여는 날 카드 한 줄로 따라간다.
# 카드는 특정 계약을 언급하지 않고 성질만 적는다.
#
# 필드
#   id        게이트가 위반·기록에 붙이는 규칙 이름
#   meaning   그 판정의 뜻 한 줄. 원장의 `why_it_matters`가 이 문장을 그대로 쓴다
#   family    missing | differs | extra_in_closed | narrowed | extra_unmentioned | 그 밖은 비워 둔다
#   direction request | response | error | surface | change  — 계약의 어느 자리인가
#   verdict   violation | observation  — violation은 REJECT로 이어지고 observation은 리포트로 간다
#   handling  auto | unfixable  — 기본 수정 가능성. 원장이 개별 항목에서 덮을 수 있다
#
# ## 규칙은 다섯 가족이다
#
# 대조의 양쪽이 모두 선언이므로 판정은 최소 포함이다. 계약이 선언한 것이 추출 스펙에 다 있어야 하고,
# 추출 스펙에 더 있는 것은 계약이 그 자리를 닫았다고 말한 경우에만 위반이다.
#
#   missing            계약이 선언한 것이 없다                                      위반
#   differs            계약이 정한 타입·형식·모양·제약·열거형·필수·보안·식별자가 다르다  위반
#   extra_in_closed    계약이 닫았다고 말한 자리에 계약에 없는 것이 있다              위반
#   narrowed           응답에서 값의 범위나 형식을 계약보다 좁게 선언했다             기록
#   extra_unmentioned  계약이 언급하지 않은 자리에 더 있다                            기록
#
# 닫은 자리를 예외로 두는 이유는 계약이 그 말을 했기 때문이다. 엄격함은 계약에서 상속된다.
# 계약이 그 객체를 열면 같은 초과가 그날부터 기록으로 떨어진다.
#
# ## 방향은 라벨이고, 판정을 가르는 자리는 하나다
#
# 차이가 좁아진 것인지 넓어진 것인지로 규칙을 가르지 않는다. 판본 대비 판본에서는 그 방향이 판정을 갈랐지만
# 선언 대비 선언에서는 대체로 아니다. 그 방향은 아래 `labels`로 옮겼고, 라벨은 리포트의 정렬과
# `decision_risk`가 쓴다.
#
# 예외는 `narrowed` 하나다. 응답에서 값의 범위와 형식이 좁아진 것은 구현이 계약이 약속한 것을 다 지키면서
# 좁게 지킨 것이므로 계약대로 읽는 쪽이 손해를 보지 않는다. 그것을 위반으로 세면 계약을 만족하는 구현이
# 떨어지므로 규칙 id를 따로 두고 여기서 기록으로 고정한다. 좁힐 수 있는 것은 값의 범위와 형식이지 타입이
# 아니므로 타입이 좁아진 것은 `differs`에 남는다. 요청은 반대 방향이라 그대로다. 계약이 받겠다고 한 것을
# 좁게 받으면 위반이다. 그 비대칭이 판본 대조와 구현 대조를 가르는 자리다.

version: 2

# 차이의 라벨. 어휘를 닫아 두고 뜻을 여기 고정한다. 판정을 가르지 않는다.
labels:
  - id: rejects_contracted_request
    meaning: 계약이 받겠다고 한 요청을 구현이 거절하게 만드는 차이다. 계약대로 부르는 쪽이 그 자리에서 막힌다.
  - id: accepts_what_contract_rejects
    meaning: 계약이 거절하겠다고 한 입력을 구현이 받아들일 수 있게 만드는 차이다. 계약은 받을 것만 정하지 않고
      형식을 어긴 입력에 어떤 실패를 돌려줄지도 정하므로, 구현이 그 제약을 자기 표면에 선언하지 않으면 계약이 한
      약속 하나가 선언에서 사라진다. 계약대로 부르는 쪽은 막히지 않으니 클라이언트의 손해는 아니지만 무해하지도
      않다. 계약이 막겠다고 한 값이 그 자리를 통과해 들어온다.
  - id: withholds_promised_response
    meaning: 계약이 주겠다고 한 것을 구현이 주지 않게 만드는 차이다. 읽는 쪽이 있다고 믿은 것이 없다.
  - id: breaks_reader
    meaning: 계약대로 읽으면 깨지는 차이다. 값의 종류가 달라졌거나 계약이 그 자리에 올 수 있다고 말한 종류 하나가
      아예 오지 않게 되어, 좁아진 것으로 보아 넘길 수 없다. 범위가 줄어드는 것과 달리 읽는 쪽은 부분집합을 받는
      것이 아니라 기다린 것을 못 받는다.
  - id: harmless_to_client
    meaning: 쓰는 쪽에 손해가 없는 차이다. 응답의 값의 범위나 형식이 계약보다 좁은 자리다. 계약대로 읽는 쪽은
      받을 수 있다고 믿은 값의 부분집합을 받는다. 리포트에서 뒤로 온다.
  - id: undeclared_surface
    meaning: 계약이 말하지 않은 표면이 자라는 차이다. 문서 밖의 것을 쓰는 사람이 의지하게 된다.

# 계약 변경의 종류. 근거의 출처만 보면 필드 하나의 표기를 바꾸는 것과 약속을 지우는 것이 같은 문턱을 지난다.
# 그래서 변경의 성질을 기계로 가르고, 판정 결과가 이 값을 싣는다. 원장과 리포트가 그것으로 정렬한다.
change_kinds:
  - id: representation
    meaning: 약속의 재고가 줄지 않았다. 판정 지점 집합과 `required` 집합과 에러 코드 쌍과 산문 슬롯 집합이
      그대로다. 문턱이 낮다. 발의한 비평을 요구하고, 그 위에 값의 표기를 고친 변경에만 닫힌 값의 표현 근거를
      요구한다. 이 성질은 약속 변경의 여집합이라 표기를 바꾼 것만 담지 않는다. 문장을 고친 것과 응답을 늘린 것도
      여기 오는데, 그 자리에는 탓할 도구 기본값이 없고 닫힌 값 중에 고를 것도 없다.
  - id: promise
    meaning: 약속의 재고가 줄었다. 판정 지점·필수·에러 코드 쌍·산문 슬롯 중 하나라도 사라진 것이다. 문턱이 높다.
      발의한 비평과 명세 근거를 함께 요구한다. 산문 슬롯이 특히 그렇다. 스키마를 한 글자도 건드리지 않아도
      약속이 줄 수 있고, 산문은 루브릭의 분모이므로 그것을 지우면 채점 대상이 사라진다.

# 값의 표기를 바꾼 근거. 닫힌 값이다. 표기를 바꾸는 데 아무 이유나 되면 안 된다.
#
# 묻는 자리는 값의 표기를 정하는 스키마 키워드를 고친 기록뿐이다. 타입·형식·모양·경계·열거형·상수·기본값과
# 그 구조를 적는 키가 그것이다. 셋 다 표기를 말하므로 문장을 고치거나 응답을 늘린 기록에는 고를 값이 없고,
# 무엇이 있느냐는 표기가 아니라 약속이라 재고와 `basis`와 `spec_anchor`가 본다.
representation_bases:
  - id: interop
    meaning: 널리 쓰이는 표기로 바꿨다. 쓰는 쪽이 이미 그 모양을 기대하는 자리다.
  - id: spec_implication
    meaning: 요구사항 명세가 그 표현을 함의한다.
  - id: contract_consistency
    meaning: 계약 안의 다른 자리가 이미 그 표현을 쓰고 있어 일관되게 했다.
# 도구나 언어의 기본 표현은 근거가 아니다. 그것을 근거로 인정하면 언어 타입을 그대로 노출한 것이 정당해지고,
# 계약이 정한 표기가 도구의 편의에 밀린다. 시각을 문자열 대신 {hour, minute, second, nano}로 낸 자리가 그 경우다.

rules:
  # ── 없다 ────────────────────────────────────────────────────────────────
  - id: surface.path_missing
    meaning: 계약이 선언한 경로가 구현에 없다.
    family: missing
    direction: surface
    verdict: violation
    handling: auto

  - id: request.operation_missing
    meaning: 계약이 선언한 경로에 그 메서드의 오퍼레이션이 없다. 받겠다고 한 요청을 그 자리로 받지 못한다.
    family: missing
    direction: request
    verdict: violation
    handling: auto

  - id: request.input_missing
    meaning: 계약이 받겠다고 선언한 입력이 구현에 없다. 파라미터든 본문 필드든 같다.
    family: missing
    direction: request
    verdict: violation
    handling: auto

  - id: request.body_missing
    meaning: 계약이 요청 본문을 받겠다고 했는데 구현의 그 오퍼레이션에 본문이 없다.
    family: missing
    direction: request
    verdict: violation
    handling: auto

  - id: response.status_missing
    meaning: 계약이 선언한 응답 상태 코드가 구현에 없다. 그 아래의 본문과 헤더와 에러 코드는 이 한 건이 설명한다.
    family: missing
    direction: response
    verdict: violation
    handling: auto

  - id: response.body_missing
    meaning: 계약이 그 응답에 담겠다고 선언한 본문이 구현에 없다.
    family: missing
    direction: response
    verdict: violation
    handling: auto

  - id: response.field_missing
    meaning: 계약이 응답에 담겠다고 선언한 필드가 구현의 응답 타입에 없다.
    family: missing
    direction: response
    verdict: violation
    handling: auto

  - id: response.header_missing
    meaning: 계약이 응답에 싣겠다고 선언한 헤더가 구현에 없다.
    family: missing
    direction: response
    verdict: violation
    handling: auto

  - id: error.code_pair_missing
    meaning: 계약이 선언한 (상태 코드, 에러 코드) 쌍이 구현에 없다. 같은 코드가 상태에 따라 다른 자리를 뜻하므로
      쌍으로 세고, 쌍 하나가 판정 지점 하나이므로 접지 않는다.
    family: missing
    direction: error
    verdict: violation
    handling: auto

  # ── 다르다 ──────────────────────────────────────────────────────────────
  - id: request.operation_id_mismatch
    meaning: 같은 경로와 메서드에 오퍼레이션이 있는데 식별자가 계약과 다르다. 판정 지점 좌표가 식별자이므로
      어긋나면 같은 자리를 가리키는 판정이 서로 다른 이름으로 갈라지고, 도구가 기본값으로 뽑은 식별자를
      그대로 두면 계약이 정한 이름이 사라진다. 고칠 것은 계약이 아니라 그 이름을 정하는 코드다.
    family: differs
    direction: request
    verdict: violation
    handling: auto

  - id: request.security_differs
    meaning: 오퍼레이션이 인증을 요구하는지가 계약과 다르다. 계약이 요구한 자리에서 요구하지 않으면 문서 밖의
      표면이 열리고, 계약이 요구하지 않은 자리에서 요구하면 계약대로 보낸 요청이 거절된다.
    family: differs
    direction: request
    verdict: violation
    handling: auto

  - id: request.schema_differs
    meaning: 계약이 그 자리에 정한 것과 다른 종류가 왔다. 최상위 타입이 다르거나 계약이 선언한 필드가 하나도
      없는 것이다. 필드 하나하나의 차이가 아니라 그 자리가 통째로 다른 것이므로 한 건으로 세고 잎은 증거로 남긴다.
    family: differs
    direction: request
    verdict: violation
    handling: auto

  - id: request.input_differs
    meaning: 계약이 그 입력에 정한 타입·형식·모양·제약·열거형·필수가 구현에서 다르다.
    family: differs
    direction: request
    verdict: violation
    handling: auto

  - id: response.schema_differs
    meaning: 계약이 그 자리에 정한 것과 다른 종류가 왔다. 최상위 타입이 다르거나 계약이 선언한 필드가 하나도
      없는 것이다. 필드 하나하나의 차이가 아니라 그 자리가 통째로 다른 것이므로 한 건으로 세고 잎은 증거로 남긴다.
    family: differs
    direction: response
    verdict: violation
    handling: auto

  - id: response.field_differs
    meaning: 계약이 그 필드에 정한 타입·형식·모양·제약·열거형·필수가 구현에서 다르다.
    family: differs
    direction: response
    verdict: violation
    handling: auto

  # ── 응답에서 좁혔다 ─────────────────────────────────────────────────────
  - id: response.value_narrowed
    meaning: 계약이 응답에 허용한 값의 범위나 형식을 구현이 더 좁게 선언했다. 계약이 값을 정하지 않은 자리에
      형식이나 모양을 붙인 것과, 계약이 정한 범위 안으로 경계나 열거형을 줄인 것이 여기 온다. 계약이 약속한
      것을 다 지키면서 좁게 지킨 것이므로 계약대로 읽는 쪽은 받을 수 있다고 믿은 값의 부분집합을 받고 손해가
      없다. 좁아진 것이 타입이면 이 규칙이 아니다. 계약이 그 자리에 올 수 있다고 말한 종류 하나가 아예 오지
      않게 되므로 `response.field_differs`에 남는다. 계약이 정한 형식이나 모양을 다른 것으로 바꾼 것도
      형식 이름 사이에 넓고 좁음의 순서가 없어 좁힌 것으로 볼 수 없으므로 거기 남는다.
    family: narrowed
    direction: response
    verdict: observation
    handling: auto

  # ── 닫은 자리에 더 있다 ─────────────────────────────────────────────────
  - id: response.field_extra_closed
    meaning: 계약이 닫아 둔 응답 객체에 계약이 선언하지 않은 필드가 있다. 계약이 그 객체를 열면 기록으로 내려간다.
    family: extra_in_closed
    direction: response
    verdict: violation
    handling: auto

  - id: error.code_undeclared
    meaning: 구현이 계약의 선언 밖에 있는 에러 코드를 쓴다. 계약이 코드 목록을 닫아 두었으므로 위반이고,
      읽는 쪽이 분기할 근거가 계약에 없다. 응답 하나의 사실이므로 코드 목록은 증거로 붙인다.
    family: extra_in_closed
    direction: error
    verdict: violation
    handling: auto

  # ── 말하지 않은 자리에 더 있다 ──────────────────────────────────────────
  - id: surface.path_extra
    meaning: 계약에 없는 경로가 구현에 있다. 계약이 그 경로를 금지하지 않았으므로 기록이고, 계약에 올릴지는 비평이 정한다.
    family: extra_unmentioned
    direction: surface
    verdict: observation
    handling: auto

  - id: surface.status_extra
    meaning: 계약이 선언하지 않은 상태 코드를 구현이 응답으로 선언한다.
    family: extra_unmentioned
    direction: surface
    verdict: observation
    handling: auto

  - id: surface.header_extra
    meaning: 계약이 선언하지 않은 응답 헤더가 있다. 계약이 그 밖의 헤더를 금지한다고 적지 않았으므로 처음부터 기록이다.
    family: extra_unmentioned
    direction: surface
    verdict: observation
    handling: auto

  - id: request.input_extra
    meaning: 계약이 말하지 않은 요청 입력을 구현이 읽는다.
    family: extra_unmentioned
    direction: request
    verdict: observation
    handling: auto

  - id: response.field_extra
    meaning: 계약이 열어 둔 응답 객체에 필드를 더했다. 계약이 금지하지 않은 확장이다.
    family: extra_unmentioned
    direction: response
    verdict: observation
    handling: auto

  # ── 스펙 대조가 아닌 판정 ───────────────────────────────────────────────
  - id: response.serialization_override
    meaning: 계약이 널을 허용하면서 필수로 둔 필드의 키가 응답에서 사라질 수 있게 만드는 직렬화 설정 재정의가
      생성 코드에 있다. 사람이 소유한 설정이 그 키를 지키고 있는데 생성 코드가 그것을 덮으면,
      추출한 스펙에는 드러나지 않는 채로 응답이 계약을 어긴다.
    direction: response
    verdict: violation
    handling: auto

  # ── 판정 장치가 보지 못한 자리 ──────────────────────────────────────────
  - id: extract.blind
    meaning: 추출한 스펙에 계약의 그 조항에 대응하는 것이 아예 없다. 미판정은 통과가 아니므로 위반으로 센다.
    direction: surface
    verdict: violation
    handling: unfixable

  # ── 결정 ────────────────────────────────────────────────────────────────
  - id: decision.overrides_contract
    meaning: 계약이 값을 정해 둔 자리를 빈자리라고 신고하고 거기서 골랐다. 그 자리는 결정이 아니라 판정 대상이다.
    direction: change
    verdict: violation
    handling: auto

  - id: decision.unknown_point
    meaning: 신고한 결정이 계약에 없는 판정 지점을 가리킨다. 좌표가 틀렸거나 계약 밖의 선택이다.
    direction: change
    verdict: observation
    handling: auto

  # ── 계약이 움직였을 때 ──────────────────────────────────────────────────
  # 계약을 고친 것 자체는 위반이 아니다. 말없이 고치는 것만 위반이다.
  - id: change.unjustified
    meaning: 앞 판본과 달라진 자리에 신고가 없거나, 신고에 발의한 비평과 명세 근거 중 하나가 비었다.
    direction: change
    verdict: violation
    handling: auto

  - id: change.promise_reduced
    meaning: 계약이 약속한 것의 재고가 줄었는데 명세 근거를 댄 기록이 없다. 판정 지점과 `required`와
      에러 코드 쌍과 산문 슬롯이 그 재고다. 고치는 것은 막지 않지만 약속을 줄이려면 명세가 그 자리를 받쳐야 하고,
      받치지 않으면 구현하기 쉬우려고 약속을 지운 것과 구별할 수 없다. 차원마다 한 건이고 사라진 것은 증거에 남는다.
    family: null
    direction: change
    verdict: violation
    handling: auto

  - id: change.anchor_uncompared
    meaning: 요구사항 명세에서 요구사항 id를 뽑지 못해 `spec_anchor`가 명세를 가리키는지 값으로 대조하지 못했다.
      그 iteration의 약속 축소 판정은 근거가 비어 있는지까지만 본 것이다. 미판정을 통과로도 최저점으로도 세지
      않으므로 초안을 떨어뜨리지 않고 사실만 남긴다. 명세가 입력에 실리지 않았거나 id를 선언하는 모양이 아닐 때 난다.
    direction: change
    verdict: observation
    handling: unfixable

  - id: change.basis_is_gate_verdict
    meaning: 계약 변경의 근거가 판정 장치의 규칙을 가리킨다. 판정 결과에 맞춰 판정 기준을 고치는 것이므로
      근거가 아니다. 계약 변경의 근거는 리뷰어가 발의한 비평 항목이고, 판정 장치의 위반은 고칠 대상이지
      고칠 이유가 아니다. 엄격함은 계약에서 상속되므로 계약을 열어 게이트를 통과하는 길을 여기서 막는다.
    direction: change
    verdict: violation
    handling: auto

  - id: change.version_file
    meaning: 계약의 내용이 바뀌었는데 판본 파일명이 그대로다. 판본을 파일로 남기는 규약이 깨지면 계약이 움직인 것을 사람이 놓친다.
    direction: change
    verdict: violation
    handling: auto

  - id: contract.previous_version_modified
    meaning: 앞 계약 판본이 고쳐졌다. 판본은 쌓이고 앞 판본은 감사 기준이므로 고칠 수 없다. 고치면 지금 판본이
      무엇에서 출발했는지 알 수 없어지고, 이미 내린 판정의 잣대가 뒤에서 바뀐다.
    direction: change
    verdict: violation
    handling: auto

  - id: change.version_label
    meaning: 판본 파일명의 판 번호와 계약 안의 버전 표기가 어긋난다. 규약 문제일 뿐이므로 기록으로 남긴다.
    direction: change
    verdict: observation
    handling: auto

  - id: change.breaking
    meaning: 앞 판본과 대조해 호환을 깨는 변경이다. 루프 안의 판본은 아직 발행된 계약이 아니므로 세기만 하고, 주 버전 규약은 승격 게이트가 본다.
    direction: change
    verdict: observation
    handling: auto

  - id: change.compatibility_mismatch
    meaning: 신고에 적힌 호환성 라벨이 대조기의 판정과 어긋난다. 호환성은 대조기가 직접 판정하므로 라벨을 신뢰할 필요가 없다.
    direction: change
    verdict: observation
    handling: auto

  - id: change.point_churn
    meaning: 판정 지점이 판본 사이에서 생기거나 사라졌다. 좌표가 굳지 않는다는 신호이고 위반이 아니라 셈이다.
    direction: change
    verdict: observation
    handling: auto

  - id: change.diff
    meaning: 앞 판본과 달라진 좌표다. 판정이 아니라 셈이므로 원장과 리포트의 재료로만 쓴다.
    direction: change
    verdict: observation
    handling: auto

  # ── 색인과 실물 ────────────────────────────────────────────────────────
  # 색인은 생성기가 자기가 쓴 것을 신고한 것이고 실물은 작업 폴더에 있다. 주장과 판정을 분리한다는 원칙이
  # 파일 목록에도 그대로 적용된다. 이 셋은 runner가 작업 폴더의 diff로 판정하고 문장을 여기서 인용한다.
  - id: manifest.declared_missing
    meaning: 색인에 적힌 경로가 작업 폴더에 없다. 쓰지 않은 것을 썼다고 신고한 것이므로 게이트가 무엇을 판정할지 알 수 없다.
    direction: change
    verdict: violation
    handling: auto

  - id: manifest.undeclared_file
    meaning: 색인에 없는 파일이 작업 폴더에서 바뀌었다. 판정 대상 밖에 조용히 놓인 파일은 판정되지 않은 표면이 된다.
    direction: change
    verdict: violation
    handling: auto

  - id: manifest.forbidden_path
    meaning: 사람이 소유해 고칠 수 없다고 정한 파일이 바뀌었다. 판정 장치나 공개 표면을 고쳐 판정을 맞추는 길을 막는다.
    direction: change
    verdict: violation
    handling: auto

  - id: change.unmatched_record
    meaning: 신고한 계약 변경이 판본 diff에 대응하는 자리가 없다. 좌표가 틀렸거나 고치겠다고 적고 고치지 않았다.
    direction: change
    verdict: observation
    handling: auto

# ── 판정이 서는 바닥이 무너진 자리 ──────────────────────────────────────────
#
# 여기 모인 판정은 계약의 어느 방향에도 들지 않는다. 컴파일과 부팅과 층 경계, 그리고 단계가 낸 산출을
# 읽을 수 있는지는 계약이 말한 것이 아니라 계약을 판정하기 전에 서 있어야 하는 바닥이다. 그래서
# `direction`을 두지 않고 따로 모은다. 위반 문장을 매번 새로 쓰지 않게 고정한다는 점은 같다.
gate_rules:
  - id: schema.invalid_output
    meaning: 단계가 낸 산출이 그 단계의 출력 계약을 지키지 않아 읽을 수 없다. 판정 대상이 성립하지 않으므로
      다음 초안은 다른 무엇보다 이것을 먼저 고쳐야 한다. 좌표마다 다른 이름을 붙이면 같은 성질의 실패가
      run마다 흩어져 집계가 안 되므로 한 id로 모은다.
    verdict: violation
    handling: auto

  - id: g0.project_missing
    meaning: 판정에 쓸 작업 폴더가 없거나 Maven 프로젝트가 아니다. 구현의 계약을 뽑을 자리가 없으므로
      미판정이고, 미판정은 통과가 아니다.
    verdict: error
    handling: unfixable

  - id: g0.extractor_missing
    meaning: 추출 스펙을 뽑는 스크립트가 없다. AI가 쓴 설명으로 대신할 수 없으므로 미판정이다.
    verdict: error
    handling: unfixable

  - id: g0.jdk_unusable
    meaning: 가리키는 JDK가 스켈레톤이 요구하는 판본보다 낮다. 초안의 잘못이 아니라 환경 문제이고,
      쓸 JDK를 고르는 것은 사람의 판단이므로 게이트가 다른 JDK를 찾아 나서지 않는다.
    verdict: error
    handling: unfixable

  - id: g0.compile_failed
    meaning: 초안이 컴파일되지 않는다. 비평할 것도 채점할 것도 없으므로 바로 다음 초안으로 보낸다.
    verdict: violation
    handling: auto

  - id: g0.arch_boundary
    meaning: 층 사이의 의존 방향을 어겼다. 도메인과 유스케이스는 HTTP와 직렬화 타입을 모르고, 인바운드 어댑터는
      아웃바운드 어댑터를 모른다.
    verdict: violation
    handling: auto

  - id: g0.extract_failed
    meaning: 부팅이나 스펙 조회가 실패해 구현의 계약을 뽑지 못했다.
    verdict: violation
    handling: auto
