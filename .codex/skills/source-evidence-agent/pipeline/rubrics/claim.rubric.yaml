id: claim:v1

# 주장마다 축별 칸을 내고 합산하지 않는다. 주장이 하네스 산출이므로 평균을 내면 어려운 주장을 지워
# 올리는 길이 열린다.
#
# 칸 수가 축마다 다르다. 조건이 쌓이는 단수가 다르기 때문이고, 5점을 만들려고 칸을 지어 넣으면
# 그 칸이 다른 축을 침범한다.

aggregate: none
claim_cap: 10

axes:
  - id: grounding
    measures: 인용이 주장을 함의하고 주장이 원문보다 넓지 않은가
    denominator: 주장 문장과 인용문
    applies_to: [fact, choice]
    floor: 3
    boxes:
      1: 인용이 주장과 다른 것을 말한다
      2: 같은 주제지만 주장 문장을 함의하지 않는다
      3: 인용이 주장 문장을 함의한다
      4: 함의하고, 원문이 단 조건이 주장 문장에 들어 있다

  - id: depth
    measures: 인용이 참·거짓을 가르는 자리인가
    denominator: 인용의 위치
    applies_to: [fact, choice]
    floor: 3
    boxes:
      1: 인용이 주장과 무관한 파일이나 절이다
      2: 선언, 목차, 속성 설명, 요약만 닿았다
      3: 그 동작을 설명하는 본문에 닿았다
      4: 그 동작이 결정되는 구현이나 조항 자체에 닿았다. 주장이 거짓이라면 이 자리의 문장이 달라야 한다
    note: >
      4점 조건의 뒷문장이 판정 입장이다. 채점자가 "이 자리가 바뀌면 주장의 참·거짓이 바뀌는가"를 묻게
      되므로, Gen이 어디를 앵커로 적었는지와 무관하게 판정된다. 게이트의 anchor_absent 는 Gen이 고른
      앵커에 Gen이 닿았는지까지만 보므로 순환하고, 이 축이 그 자리를 메운다.

  - id: tradeoff_coverage
    measures: 지정된 차원 중 몇 개에 교환이 명시됐는가
    denominator: 차원 목록
    applies_to: [choice]
    floor: 3
    boxes:
      1: 명시된 차원 0개
      2: 1개
      3: 2개
      4: 3개
      5: 지정된 차원 전부
    note: >
      한 차원을 충족시키는 방법이 둘이다. 대안 대비 무엇을 얻고 무엇을 치르는지 적거나, 그 차원에서
      교환이 없다는 것과 왜 없는지를 적는 것이다. 교환이 없는 주장에 억지로 비용을 지어내게 하면
      없는 트레이드오프가 생겨난다.

  - id: tradeoff_validity
    measures: 명시된 교환이 좌표와 맞고 전제가 붙었는가
    denominator: 명시된 교환 항목들. '교환 없음' 선언도 분모에 들어간다
    applies_to: [choice]
    floor: 3
    boxes:
      1: 좌표 없는 일반론이 하나 이상 있다
      2: 전부 좌표가 있지만, 좌표가 가리키는 것이 그 항목을 뒷받침하지 않는 것이 있다
      3: 모든 항목이 좌표와 맞는다
      4: 3에 더해, 항목마다 어느 전제에서 성립하는지 적혀 있다
      5: 4에 더해, 그 전제가 뒤집히는 값을 지목했다. 어느 수치를 넘으면 반대가 되는지
    note: >
      '교환 없음' 선언을 분모에 넣는 이유가 있다. 넣지 않으면 모든 차원을 '없음'으로 채워 coverage 를
      만점으로 만들고 validity 는 볼 항목이 없어 분모가 빈다. 선언의 좌표는 왜 교환이 없는지의 근거다.
      2점 칸을 따로 둔 것은 그럴듯하지만 좌표 없는 문장이 생성 쪽이 가장 잘 쓰는 종류이기 때문이다.

# 트레이드오프의 차원. 루브릭 본문은 "지정된 차원 중 몇 개"로 쓰고 목록은 데이터로 둔다. 다음 대상에서는
# 이 목록만 갈아끼운다. gen_output.schema.json 의 dimension enum 과 같아야 하고, 리허설이 그것을 검사한다.
#
# 규모는 차원에 두지 않는다. 요청이나 인스턴스가 늘면 지연과 자원이 변하는 것이라 별도 차원이 아니라
# 두 차원의 조건이고, 차원으로 두면 그 둘과 늘 같이 움직인다. 규모는 tradeoff_validity 의 전제에서 본다.
dimensions:
  - id: latency
    asks: 지연과 처리 시간이 어떻게 달라지는가
  - id: resource
    asks: CPU, 연결, 메모리를 더 쓰는가 덜 쓰는가
  - id: failure
    asks: 실패 양상이 바뀌는가. 대기, 교착, 요청 오류, 재시도
  - id: complexity
    asks: 코드와 운영에서 더 챙길 것이 생기는가

# READY 는 게이트 위반 0, 미판정 0, 그리고 모든 주장이 해당 축의 하한을 넘은 것이다.
# 하한 판정은 코드가 한다. 점수는 재료이고 통과는 채점자가 정하지 않는다.
ready:
  requires:
    - 게이트 위반 0
    - 미판정 0
    - 적용되는 모든 축이 하한 이상

# 리포트 정렬. 루브릭의 주 용도가 이것이다. 주장 전부의 근거를 정독하는 것과 미달 주장부터 정독하는
# 것은 비용이 다르다.
sort:
  - 하한 미달 축 수가 많은 순
  - 칸 합이 낮은 순
